services:
  - type: web
    name: patchpilot-backend
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: "*"
